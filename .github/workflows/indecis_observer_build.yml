name: Build Indecis Mobile Observer

on:
  push:
    branches:
      - indecis-mobile-observer
    paths:
      - 'indecis-observer/**'
      - '.github/workflows/indecis_observer_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        working-directory: indecis-observer
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Indecis-Mobile-Observer-1.0.0-mc1.21.11
          path: |
            indecis-observer/build/libs/Indecis-Mobile-Observer-1.0.0.jar
            indecis-observer/build/libs/Indecis-Mobile-Observer-1.0.0-sources.jar
          if-no-files-found: error
